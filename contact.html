<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Bakery</title>


</head>

<body class="pt-5">

    <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="index.html"><img class="logo-img" src="/images/logoo.png" alt="Bakey Logo">
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#m">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="m">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="service.html">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="galerie.html">Galerie</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    <section>
        <div class="position-relative overflow-hidden vh-100 w-100">
            <img src="/images/i1.jpg" class="img-fluid w-100 bgback" id="im1">
            <div class="position-absolute top-0 start-0 w-100 h-100 w-100 justify-content-center align-items-center">
                <div class="row min-vh-100 align-items-center justify-content-center text-center g-4">
                    <div class="col-12 col-md-6 fade-up">
                        <a href="contact.html" class="gi"><h1 class="text-center fw-bold mb-4 display-3 gi">Get in Touch</h1></a>
                        <p class="text-center m-4">We would love to hear from you! Whether you have questions
                            about
                            our
                            products, want to place a custom order, or just want to say hello, feel free to reach
                            out to
                            us using the form below.</p>

                    </div>
                    <div class="form-contact p-4 rounded-3 shadow col-12 col-md-6 fade-up">
                        <form action="">
                            <h2 class="text-center fw-bold">
                                <a href="contact.html" id="c">Contact Us</a>
                            </h2>
                            <div>
                                <input type="text" class="form-control mb-3 rounded-pill" placeholder="Your Name"
                                    required>
                                <input type="email" class="form-control mb-3 rounded-pill" placeholder="Your Email"
                                    required>
                                <textarea class="form-control mb-3 rounded-3" rows="2" placeholder="Your Message"
                                    required></textarea>
                                <div class="row d-flex justify-content-center gap-3">
                                    <button type="reset"
                                        class="btn btn-secondary btn-sm w-25 col-6 col-sm-12 overflow-hidden">Reset</button>
                                    <button type="submit"
                                        class="btn btn-primary btn-sm w-25 col-6 col-sm-12 overflow-hidden">Send</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

    </section>

    <footer class="w-100">
        <div class="text-center p-3">
            &copy; 2026 Bakery. All rights reserved.
        </div>
    </footer>
    <script src="bootstrap.bundle.min.js"></script>
</body>

</html>
